name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The lint and typecheck jobs run without nix, so they pin the tools the dev
# shell gets from nixpkgs. The `pins` job fails if either drifts from the
# flake -- keep these two lines as the only place the versions appear.
env:
  RUFF_VERSION: "0.15.11"
  PYRIGHT_VERSION: "1.1.408"

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run tests
        run: uv run pytest -q
        env:
          HYPOTHESIS_PROFILE: ci

  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint
        run: uvx ruff@${{ env.RUFF_VERSION }} check smfeval tests scripts
      - name: Format check
        run: uvx ruff@${{ env.RUFF_VERSION }} format --check smfeval tests scripts
      - name: Exporter layout
        run: uv run python scripts/check_exporters.py
      - name: SQUARE spec version matches FORMAT_VERSION
        run: |
          fmt=$(uv run python -c "from smfeval.format import FORMAT_VERSION; print(FORMAT_VERSION)")
          spec=$(sed -n 's/^\*\*Version:\*\* \(.*\)/\1/p' SQUARE_spec.md | head -1)
          echo "code=$fmt  spec=$spec"
          [ "$fmt" = "$spec" ] || { echo "::error::SQUARE_spec.md Version ($spec) != FORMAT_VERSION ($fmt)"; exit 1; }

  typecheck:
    name: pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --dev
      - name: Typecheck
        run: uvx pyright@${{ env.PYRIGHT_VERSION }}

  pins:
    name: pins match flake
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - name: Tool pins match the flake's nixpkgs
        run: |
          status=0
          check() {
            flake=$(nix eval --raw ".#toolVersions.x86_64-linux.$1")
            echo "$1: pinned=$2 flake=$flake"
            if [ "$2" != "$flake" ]; then
              echo "::error::$1 pin $2 != flake.lock's nixpkgs ($flake). Set $3 in this file to $flake, or revert the flake.lock bump."
              status=1
            fi
          }
          check ruff "$RUFF_VERSION" RUFF_VERSION
          check pyright "$PYRIGHT_VERSION" PYRIGHT_VERSION
          exit $status

  docs:
    name: sphinx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync dependencies
        run: uv sync --group docs
      - name: Build docs (warnings are errors)
        run: uv run --group docs sphinx-build -W -b html docs docs/_build/html
